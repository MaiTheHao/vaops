spring:
  application:
    name: vaops
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080
vaops:
  app:
    is-prod: false
  cors:
    allowed-origins:
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "Cache-Control"
    allow-credentials: true
    exposed-headers:
      - X-Request-Id
    max-age: 3600
  databases:
    primary:
      host: 127.0.0.1
      port: 5432
      name: vaops
      username: postgres
      password: postgres

  auth:
    "[default-role-code]": USER
    "[refresh-grace-window-seconds]": 30
    jwt:
      access-expiration-ms: 3600000
      refresh-expiration-ms: 604800000

