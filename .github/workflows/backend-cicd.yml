name: VAOPS Spring Boot Backend CI/CD

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/backend-cicd.yml'
      - 'backend/**'
  pull_request:
    branches: ['master']
    paths:
      - '.github/workflows/backend-cicd.yml'
      - 'backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      - name: Run unit & integration tests
        run: ./mvnw test

      - name: Build executable JAR
        run: ./mvnw clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaops-backend-jar
          path: backend/target/*.jar
          retention-days: 1

  docker-build-push:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vaops-backend-jar
          path: backend/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vaops-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/vaops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:github

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG
          script: |
            cd ~/workspace/infra/docker
            export BACKEND_TAG=$TAG
            docker compose -f compose.prod.yml --env-file .env.prod pull backend
            docker compose -f compose.prod.yml --env-file .env.prod up -d --no-deps backend
            docker image prune -f