name: VAOPS Angular Frontend CI/CD

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/frontend-cicd.yml'
      - 'frontend/**'
  pull_request:
    branches: ['master']
    paths:
      - '.github/workflows/frontend-cicd.yml'
      - 'frontend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaops-frontend-dist
          path: frontend/dist/frontend
          retention-days: 1

  docker-build-push:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          build-args: |
            NG_APP_API_URL=${{ secrets.NG_APP_API_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vaops-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/vaops-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:github

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG
          script: |
            cd ~/workspace/infra/docker
            export FRONTEND_TAG=$TAG
            docker compose -f compose.prod.yml --env-file .env.prod pull frontend
            docker compose -f compose.prod.yml --env-file .env.prod up -d --no-deps frontend
            docker image prune -f
