name: VAOPS Infra Deploy

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/infra-ci.yml'
      - 'infra/**'
  pull_request:
    branches: ['master']
    paths:
      - '.github/workflows/infra-ci.yml'
      - 'infra/**'

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:github

      - name: Sync infra folder to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "infra/*"
          target: "~/workspace/infra"
          strip_components: 1

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/workspace/infra/docker
            cat <<EOF > .env.prod
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            BE_CORS_ALLOWED_ORIGINS=${{ secrets.BE_CORS_ALLOWED_ORIGINS }}
            EOF
            docker compose -f compose.prod.yml --env-file .env.prod pull
            docker compose -f compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker compose -f compose.prod.yml exec -T nginx nginx -s reload || true
            docker image prune -f
