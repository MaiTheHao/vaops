name: vaops-dev
services:
  postgres:
    image: postgres:17-alpine
    container_name: vaops-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=UTC
    ports:
      - '${DB_PORT}:5432'
    networks:
      - vaops-network-dev
    volumes:
      - vaops_pg_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d

    command: >
      postgres 
      -c 'shared_buffers=1GB' 
      -c 'work_mem=32MB'
      -c 'maintenance_work_mem=256MB'
      -c 'effective_cache_size=4GB'
      -c 'max_connections=100'
      -c 'fsync=off' 
      -c 'full_page_writes=off'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10
    container_name: vaops-flyway-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vaops-network-dev
    volumes:
      - ../database/migrations:/flyway/sql
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/${DB_NAME}?currentSchema=public
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql
      - FLYWAY_BASELINE_ON_MIGRATE=true
      - FLYWAY_CONNECT_RETRIES=10
    command: migrate
    restart: 'no'

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: vaops-backend
    container_name: vaops-backend-dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - vaops-network-dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NG_APP_API_URL: ${NG_APP_API_URL}
    image: vaops-frontend
    container_name: vaops-frontend-dev
    restart: unless-stopped
    ports:
      - '8081:4200'
    networks:
      - vaops-network-dev
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: vaops-nginx-dev
    restart: unless-stopped
    ports:
      - '8082:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vaops-network-dev
    depends_on:
      - frontend
      - backend

volumes:
  vaops_pg_data:
    name: vaops_database_volume

networks:
  vaops-network-dev:
    driver: bridge
